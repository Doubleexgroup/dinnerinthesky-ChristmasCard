<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Card | Dinner in the Sky</title>
<meta name="description" content="La Christmas Card Dinner in the Sky: il regalo per chi merita un'esperienza indimenticabile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   COSA MODIFICARE
   - IMMAGINI, LOGHI, TESTI, DATI AZIENDA, LINK: blocco "IMPOSTAZIONI" in fondo
   - DIMENSIONE DEI LOGHI: --logo-height e --logo-azienda-height qui sotto
   ===================================================================== */
:root{
  --logo-height:50px;
  --logo-azienda-height:42px;
  --page-image:url('IMG/sfondo1.jpg'); /* si aggiorna da IMPOSTAZIONI */
  --bg:#0a0305;
  --gold:#e0b765;
  --gold-d:#b98a35;
  --cream:#f7eddc;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:300 1rem/1.6 var(--sans);color:var(--cream);background:var(--bg);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.05}
h1 i{color:var(--gold);font-weight:500}

/* Sfondo */
.bg{position:fixed;inset:0;z-index:-1;background:var(--page-image) 62% center/cover no-repeat,var(--bg)}

/* Una sola schermata: colonna alta quanto lo schermo */
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(10,3,5,.25) 0,rgba(10,3,5,.5) 45%,rgba(10,3,5,.82) 100%)}

/* Logo in alto a sinistra */
.top{padding:max(14px,env(safe-area-inset-top)) max(20px,3vw) 0}
.logo{display:inline-block}
.logo img{height:var(--logo-height);width:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.55))}
[hidden]{display:none!important}

/* Centro */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 22px;gap:clamp(8px,1.6vh,16px)}
.eyebrow{font:500 .72rem var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(1.8rem,min(5vw,7vh),4.2rem);text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero-img{width:auto;height:auto;max-width:min(360px,68vw);max-height:min(22vh,210px);object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
.lead{max-width:32em;font-size:clamp(.92rem,1.2vw + .3vh,1.12rem);text-shadow:0 2px 16px rgba(0,0,0,.7)}

/* UNICO PULSANTE */
.cta{position:relative;display:inline-block;padding:15px 40px;border-radius:999px;color:#2a1604;text-decoration:none;font:500 .82rem var(--sans);letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(115deg,#f3d995,var(--gold) 45%,var(--gold-d));box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 14px 38px rgba(224,183,101,.35);overflow:hidden;transition:transform .25s,box-shadow .25s}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-80px;width:46px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{60%,100%{left:120%}}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 20px 50px rgba(224,183,101,.55)}

/* I tre punti */
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:1080px;width:100%;margin:0 auto;padding:6px max(20px,3vw) 16px}
.points div{border-top:1px solid var(--gold);padding-top:10px}
.points h3{font-size:1.2rem;margin-bottom:3px}
.points p{font-size:.82rem;line-height:1.45;opacity:.85}

/* Parte bassa: dati azienda + logo azienda + FAQ e condizioni */
.foot{background:rgba(5,1,2,.9);border-top:1px solid rgba(224,183,101,.25);padding:14px max(20px,3vw) max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;font-size:.8rem;color:rgba(247,237,220,.78)}
.foot .azienda-logo img{height:var(--logo-azienda-height);width:auto}
.foot .dati strong{color:var(--cream);font-weight:500}
.foot a{color:var(--gold);text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .links{display:flex;flex-direction:column;gap:2px;text-align:right}
.copy{grid-column:1/-1;text-align:center;font-size:.72rem;opacity:.55;border-top:1px solid rgba(255,255,255,.1);padding-top:8px}

@media(max-width:820px){
  :root{--logo-height:38px;--logo-azienda-height:34px}
  .bg{background-position:66% center}
  .points{grid-template-columns:1fr;gap:10px;padding-bottom:12px}
  .points h3{font-size:1.05rem}
  .points p{font-size:.76rem;line-height:1.35}
  .foot{grid-template-columns:1fr;text-align:center;gap:8px}
  .foot .azienda-logo{display:flex;justify-content:center}
  .foot .links{flex-direction:row;justify-content:center;gap:16px;text-align:center}
}
@media(max-height:620px) and (min-width:821px){.hero-img{display:none}}
@media(prefers-reduced-motion:reduce){#snow{display:none}.cta::after{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<div class="bg" id="bg" role="img"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="page">
  <div class="top">
    <!-- LOGO in alto a sinistra (voce "logo" in IMPOSTAZIONI) -->
    <a class="logo" id="logo" hidden><img id="logoImg" alt=""></a>
  </div>

  <main class="hero">
    <div class="eyebrow" data-t="sopratitolo"></div>
    <h1 data-t="titolo"></h1>
    <!-- UNICO PULSANTE: si apre in una nuova scheda -->
    <a class="cta" id="bottone" target="_blank" rel="noopener noreferrer"></a>
    <img class="hero-img" id="heroImg" alt="" hidden>
    <p class="lead" data-t="sottotitolo"></p>
  </main>

  <section class="points">
    <div><h3 data-t="punto1Titolo"></h3><p data-t="punto1Testo"></p></div>
    <div><h3 data-t="punto2Titolo"></h3><p data-t="punto2Testo"></p></div>
    <div><h3 data-t="punto3Titolo"></h3><p data-t="punto3Testo"></p></div>
  </section>

  <footer class="foot">
    <a class="azienda-logo" id="aziendaLogoLink" hidden><img id="aziendaLogo" alt=""></a>
    <div class="dati" id="dati"></div>
    <nav class="links" aria-label="Informazioni">
      <a id="linkFaq" target="_blank" rel="noopener"></a>
      <a id="linkCond" target="_blank" rel="noopener"></a>
    </nav>
    <p class="copy" data-t="copyright"></p>
  </footer>
</div>

<!-- =====================================================================
     IMPOSTAZIONI: immagini, loghi, dati azienda e testi.
     Modifica SOLO tra gli apici. Nei nomi dei file le maiuscole contano.
     Per una parola in oro nei titoli usa <i>parola</i>.
     ===================================================================== -->
<script>
var IMPOSTAZIONI = {
  /* IMMAGINI (file nella cartella IMG) */
  sfondo:        "IMG/sfondo1.jpg",
  logo:          "IMG/Logo Dinner in the Sky Italy_1.png",   /* logo in alto a sinistra; "" = nessuno */
  logoLink:      "https://www.dinnerinthesky.it",
  logoAlt:       "Dinner in the Sky",
  immagineTitolo:    "IMG/Gift Card Dinner in the Sky Natale.png",  /* immagine centrale; "" = nessuna */
  immagineTitoloAlt: "",

  /* DATI AZIENDA (parte bassa). Lascia "" per nascondere una voce */
  logoAzienda:     "IMG/logo-azienda.png",   /* logo aziendale in basso; se il file non c'è, non compare */
  logoAziendaAlt:  "Dinner in the Sky Italia",
  logoAziendaLink: "",
  ragioneSociale:  "DINNER IN THE SKY ITALIA SRL",
  indirizzo:       "",                       /* es. "Via Roma 1, 00100 Roma (RM)" */
  piva:            "04391010404",
  email:           "supporto@dinnerinthesky.it",
  telefono:        "+39 342 798 2112",
  telefonoLink:    "+393427982112",

  /* ALTRE SCHEDE (si aprono in una nuova scheda del browser) */
  testoFaq:        "FAQ",
  linkFaq:         "faq.html",
  testoCondizioni: "Condizioni contrattuali",
  linkCondizioni:  "condizioni.html",

  /* TESTI */
  titoloPagina:  "Christmas Card | Dinner in the Sky",
  descrizioneSfondo: "Christmas Card Dinner in the Sky con tavola sospesa sulla città, regali e lanterna",

  sopratitolo:   "Dinner in the Sky · Natale",
  titolo:        "Regala una <i>cena nel cielo</i>",
  sottotitolo:   "La Christmas Card per chi merita un'esperienza indimenticabile.",

  bottoneTesto:  "Acquista la Christmas Card",
  bottoneLink:   "https://www.dinnerinthesky.it/gift-card",

  punto1Titolo:  "Scegli il valore",
  punto1Testo:   "Quest'anno il valore del regalo lo scegli tu. Seleziona l'importo ideale e preparati a lasciare sotto l'albero un'emozione.",
  punto2Titolo:  "Regalala subito",
  punto2Testo:   "Come un pacco speciale che arriva a sorpresa, ma digitale: la Christmas Card entra nella casella email che scegli tu, la tua o quella di chi la riceve.",
  punto3Titolo:  "Vola tra le stelle",
  punto3Testo:   "Chi la scarta non riceve un oggetto, ma un'esperienza fuori dall'ordinario: colazione, pranzo, aperitivo o cena, in alto ed un panorama che non si dimentica.",

  copyright:     "© 2026 DINNER IN THE SKY ITALIA SRL · Tutti i diritti riservati"
};

/* ---- Da qui in poi non modificare ---- */
(function(){
  var C=IMPOSTAZIONI,$=function(id){return document.getElementById(id)};
  document.title=C.titoloPagina;
  if(C.sfondo)document.documentElement.style.setProperty('--page-image',"url('"+C.sfondo+"')");
  $('bg').setAttribute('aria-label',C.descrizioneSfondo);
  document.querySelectorAll('[data-t]').forEach(function(el){el.innerHTML=C[el.dataset.t]||''});
  var b=$('bottone');b.textContent=C.bottoneTesto;b.href=C.bottoneLink;

  /* Immagine opzionale: compare solo se il file esiste */
  function opz(src,imgId,alt,wrap,link){
    if(!src)return;
    var i=$(imgId),w=wrap?$(wrap):i;
    i.onerror=function(){w.hidden=true};
    i.onload=function(){w.hidden=false};
    i.alt=alt||'';
    if(link!==undefined&&w.tagName==='A'){if(link)w.href=link;else w.removeAttribute('href')}
    i.src=src;
  }
  opz(C.logo,'logoImg',C.logoAlt,'logo',C.logoLink||'#');
  opz(C.immagineTitolo,'heroImg',C.immagineTitoloAlt);
  opz(C.logoAzienda,'aziendaLogo',C.logoAziendaAlt,'aziendaLogoLink',C.logoAziendaLink);

  /* Dati azienda */
  var d=$('dati'),parti=[];
  function txt(s){var n=document.createElement('span');n.textContent=s;return n}
  function lnk(s,h){var a=document.createElement('a');a.textContent=s;a.href=h;return a}
  if(C.ragioneSociale){var s=document.createElement('strong');s.textContent=C.ragioneSociale;parti.push(s)}
  if(C.indirizzo)parti.push(txt(C.indirizzo));
  if(C.piva)parti.push(txt('P.IVA '+C.piva));
  if(C.email)parti.push(lnk(C.email,'mailto:'+C.email));
  if(C.telefono)parti.push(lnk(C.telefono,'tel:'+(C.telefonoLink||C.telefono)));
  parti.forEach(function(n,k){if(k)d.appendChild(document.createTextNode(' · '));d.appendChild(n)});

  var f=$('linkFaq'),c=$('linkCond');
  f.textContent=C.testoFaq;f.href=C.linkFaq;
  c.textContent=C.testoCondizioni;c.href=C.linkCondizioni;
})();

/* Neve che cade (si ferma se l'utente preferisce meno animazioni) */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.getElementById('snow'),x=c.getContext('2d'),W,H,F=[],d=Math.min(devicePixelRatio||1,2);
  function init(){
    W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);F=[];
    for(var i=0,n=W<700?60:130;i<n;i++){var z=Math.random();F.push({x:Math.random()*W,y:Math.random()*H,r:.8+z*3,v:.3+z*1.2,s:Math.random()*6.28,a:.4+z*.5,g:Math.random()>.85})}
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    F.forEach(function(f){
      f.y+=f.v;f.x+=Math.sin(t/1500+f.s)*.35;
      if(f.y>H+6){f.y=-6;f.x=Math.random()*W}
      x.globalAlpha=f.a;x.fillStyle=f.g?'#e0b765':'#fff';x.shadowColor=f.g?'#e0b765':'#fff';x.shadowBlur=f.r*2.2;
      x.beginPath();x.arc(f.x,f.y,f.r,0,6.28);x.fill()
    });
    requestAnimationFrame(draw)
  }
  init();addEventListener('resize',init);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
